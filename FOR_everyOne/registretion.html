<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Precision Architect</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-[#dae4ee] min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-slate-100 overflow-hidden">
        <div class="p-8 pb-4 text-center">
            <div class="text-2xl font-extrabold text-[#006ADC] tracking-tighter mb-2">Precision Architect</div>
            <h2 class="text-xl font-bold text-slate-800">Create your account</h2>
        </div>

        <form id="registrationForm" action="../PHP/register.php" method="POST" class="p-8 pt-4 space-y-4">
            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Full Name</label>
                <input type="text" id="regName" name="user_name" required placeholder="Sujal Dwivedi" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Email Address</label>
                <input type="email" id="regEmail" name="email" required placeholder="name@example.com" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-400 focus:border-transparent transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Institution Name</label>
                <input type="text" id="regInst" name="institution" required placeholder="College Name" 
                    list="collegesList"
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
                <datalist id="collegesList"></datalist>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Institution Code</label>
                <input type="text" id="regInstCode" name="institution_code" required placeholder="e.g., MIT001" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Role</label>
                <select id="regRole" name="role" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all bg-white" onchange="toggleSemester()">
                    <option value="Student">Student</option>
                    <option value="Teacher">Teacher</option>
                    <option value="Admin">Admin</option>
                </select>
            </div>

            <div id="semesterDiv" class="hidden">
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Semester</label>
                <select id="regSemester" name="semester" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all bg-white">
                    <option value="1">SEM 1</option>
                    <option value="2">SEM 2</option>
                    <option value="3">SEM 3</option>
                    <option value="4">SEM 4</option>
                    <option value="5">SEM 5</option>
                    <option value="6">SEM 6</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-bold uppercase tracking-wider text-slate-400 mb-1">Password</label>
                <input type="password" id="regPass" name="password" required placeholder="••••••••" 
                    class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-400 transition-all">
            </div>

            <button type="submit" class="w-full bg-[#006ADC] text-white font-bold py-4 rounded-2xl shadow-lg shadow-blue-200 hover:bg-blue-700 transition-all cursor-pointer">
                Register Account
            </button>
        </form>

        <div class="bg-slate-50 p-6 text-center border-t border-slate-100">
            <p class="text-sm text-slate-500">
                Already have an account? 
                <a href="login.html" class="text-[#006ADC] font-bold hover:underline">Log in</a>
            </p>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
