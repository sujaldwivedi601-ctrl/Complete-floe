<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generate Timetable - Precision Architect</title>
  <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
  <style>
    body { font-family: 'Inter', sans-serif; }
    .glass-panel {
      background: rgba(255, 255, 255, 0.6);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
    }
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-20px); }
      100% { transform: translateY(0px); }
    }
    .animate-float { animation: float 6s ease-in-out infinite; }
    .animate-float-delayed { animation: float 8s ease-in-out infinite 2s; }
  </style>
</head>

<body class="bg-slate-50 text-slate-800 min-h-screen relative" onload="insertNav('Teacher'); setActiveNav('generate_timetable.html')">
  <div class="absolute top-[-10%] left-[-10%] w-96 h-96 bg-blue-400/20 rounded-full mix-blend-multiply filter blur-[80px] animate-float z-0"></div>
  <div class="absolute bottom-[-10%] right-[-5%] w-[30rem] h-[30rem] bg-indigo-400/20 rounded-full mix-blend-multiply filter blur-[100px] animate-float-delayed z-0"></div>

  <main class="relative z-10 max-w-[1440px] mx-auto p-6">
    <div class="grid grid-cols-12 gap-6">
      <div class="col-span-12 lg:col-span-4 space-y-6">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
          <h2 class="text-[#006ADC] font-bold mb-4 flex items-center gap-2">
            <span class="material-symbols-outlined">person_add</span> Teachers
          </h2>
          <div class="flex gap-2">
            <input id="teacherInput" type="text" placeholder="Teacher Name"
              class="flex-1 border-slate-200 rounded-xl p-2.5" />
            <button id="addTeacherBtn"
              class="bg-[#006ADC] text-white p-2.5 rounded-xl w-12 flex items-center justify-center">
              <span class="material-symbols-outlined">add</span>
            </button>
          </div>
          <div id="teacherListUI" class="mt-4 space-y-2 max-h-40 overflow-y-auto custom-scrollbar"></div>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 ">
          <h2 class="text-[#006ADC] font-bold mb-4 flex items-center gap-2">
            <span class="material-symbols-outlined">upload_file</span>
            Semesters
          </h2>
          <div class="grid grid-cols-2 sm:grid-cols-3 gap-4" id="semesterGrid">
            <div class="sem-row" data-semester="1">
              <label class="sem-label text-center">
                <h2>Sem 1</h2>
              </label>
              <input type="file" class="pdf-file-input" accept=".pdf" hidden />
              <div class="file-name">No file selected</div>
            </div>
            <div class="sem-row" data-semester="2">
              <label class="sem-label text-center">
                <h2>Sem 2</h2>
              </label>
              <input type="file" class="pdf-file-input" accept=".pdf" hidden />
              <div class="file-name">No file selected</div>
            </div>
            <div class="sem-row" data-semester="3">
              <label class="sem-label text-center">
                <h2>Sem 3</h2>
              </label>
              <input type="file" class="pdf-file-input" accept=".pdf" hidden />
              <div class="file-name">No file selected</div>
            </div>
            <div class="sem-row" data-semester="4">
              <label class="sem-label text-center">
                <h2>Sem 4</h2>
              </label>
              <input type="file" class="pdf-file-input" accept=".pdf" hidden />
              <div class="file-name">No file selected</div>
            </div>
            <div class="sem-row" data-semester="5">
              <label class="sem-label text-center">
                <h2>Sem 5</h2>
              </label>
              <input type="file" class="pdf-file-input" accept=".pdf" hidden />
              <div class="file-name">No file selected</div>
            </div>
            <div class="sem-row" data-semester="6">
              <label class="sem-label text-center">
                <h2>Sem 6</h2>
              </label>
              <input type="file" class="pdf-file-input" accept=".pdf" hidden />
              <div class="file-name">No file selected</div>
            </div>
          </div>
        </div>
        <button class="w-full mt-4 bg-slate-800 text-white font-bold py-3 rounded-xl" onclick="uploadPDF()">
          Extract Data
        </button>
      </div>

      <div class="col-span-12 lg:col-span-8">
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-200 min-h-[500px] flex flex-col relative">
          <div class="flex justify-between items-center mb-6 border-b pb-4">
            <h2 class="text-[#006ADC] font-bold text-lg">Subject Details</h2>
            <div class="flex items-center gap-3">
              <button id="publishBtn" onclick="publishTimetable()"
                class="hidden bg-[#006ADC] hover:bg-blue-700 text-white px-6 py-2.5 rounded-xl font-bold flex items-center gap-2">
                <span class="material-symbols-outlined">public</span>
                Publish to Students
              </button>
              <button id="generateBtn"
                class="bg-[#27ae60] hover:bg-green-700 text-white px-8 py-2.5 rounded-xl font-bold shadow-md flex items-center gap-2">
                <span class="material-symbols-outlined">auto_awesome</span>
                Generate Timetable
              </button>
            </div>
          </div>

          <div id="loader" class="loader-wrapper" style="display: none">
            <div class="loader"></div>
          </div>
          <div id="tablesContainer" class="flex-1"></div>
        </div>
      </div>
    </div>

    <div class="mt-12 pt-8 border-t border-slate-300">

      <div id="timetableContainer" class="flex flex-col gap-10 pb-10"></div>
    </div>
  </main>

  <script src="style.js"></script>
  <script src="dashboard.js"></script>
  <script>
    document.getElementById('logoutBtn')?.addEventListener('click', () => {
      fetch('../PHP/logout.php', { method: 'POST' })
        .then(() => window.location.href = 'login.html');
    });
  </script>
</body>

</html>
