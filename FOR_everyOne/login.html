<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Portal</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h2>Welcome Back</h2>
            <p>Please enter your credentials</p>
        </div>

        <form action="../PHP/login.php" method="POST">
            <div class="input-group">
                <label for="user_name">Username</label>
                <input type="text" id="user_name" name="user_name" placeholder="Enter username" required>
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <div class="input-group">
                <label>Login as</label>
                <input type="hidden" id="role" name="role" value="">
                <div class="role-buttons">
                    <button type="button" class="role-btn" onclick="selectRole('student')" data-role="student">I am a Student</button>
                    <button type="button" class="role-btn" onclick="selectRole('teacher')" data-role="teacher">I am a Teacher</button>
                </div>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div class="footer-links">
            <!-- <a href="#">Forgot Password?</a> -->
            <!-- <span>•</span> -->
            <a href="registretion.html">Create Account</a>
        </div>
    </div>

    <script>
        function selectRole(role) {
            document.getElementById('role').value = role;
            document.querySelectorAll('.role-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.role === role) {
                    btn.classList.add('active');
                }
            });
        }
    </script>
</body>
</html>
