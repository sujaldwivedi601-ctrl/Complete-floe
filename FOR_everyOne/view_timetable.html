<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>View Timetable - Precision Architect</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        @media print {
            .no-print { display: none; }
        }
    </style>
</head>
<body class="bg-[#f8fafc] text-[#1e293b] min-h-screen pb-20">

    <header class="h-16 bg-white border-b border-slate-200 sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-6 h-full flex justify-between items-center">
            <div class="flex items-center gap-4">
                <a href="index.html" class="p-2 hover:bg-slate-100 rounded-xl transition-colors">
                    <span class="material-symbols-outlined">arrow_back</span>
                </a>
                <h1 id="pageTitle" class="text-xl font-bold text-slate-800">Viewing Timetable</h1>
            </div>
            <div class="flex gap-3">
                <button onclick="exportPDF()" class="bg-[#006ADC] hover:bg-blue-700 text-white px-5 py-2.5 rounded-xl font-bold shadow-sm flex items-center gap-2 transition-all active:scale-95">
                    <span class="material-symbols-outlined">download</span>
                    Export to PDF
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto p-6 md:p-10">
        <div id="captureArea" class="bg-white p-8 md:p-12 rounded-[2rem] shadow-xl border border-slate-100">
            <div class="text-center mb-10">
                <h2 id="timetableTitle" class="text-3xl font-black text-slate-900 mb-2">Loading Timetable...</h2>
                <div class="flex items-center justify-center gap-4">
                    <span id="timetableType" class="text-xs font-bold text-[#006ADC] uppercase tracking-widest bg-blue-50 px-3 py-1 rounded-full border border-blue-100">...</span>
                    <span id="timetableDate" class="text-xs text-slate-400 font-medium tracking-wide italic">...</span>
                </div>
            </div>

            <div id="timetableContent" class="space-y-12">
                <!-- Timetables will be rendered here -->
                <div class="flex justify-center py-20">
                    <div class="animate-spin rounded-full h-10 w-10 border-4 border-[#006ADC] border-t-transparent"></div>
                </div>
            </div>
            
            <div class="mt-12 pt-8 border-t border-slate-100 text-center text-[10px] text-slate-300 font-medium uppercase tracking-[0.2em]">
                Generated by Precision Architect • Intelligent Scheduling System
            </div>
        </div>
    </main>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');

            if (!id) {
                alert("No timetable ID provided.");
                window.location.href = 'index.html';
                return;
            }

            fetch(`../PHP/get_timetable_by_id.php?id=${id}`)
                .then(res => res.json())
                .then(data => {
                    if (data.success) {
                        displayTimetable(data.timetable);
                    } else {
                        alert(data.error);
                        window.location.href = 'index.html';
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("Error loading data.");
                });
        });

        function displayTimetable(timetable) {
            const { title, type, created_at, timetable_data } = timetable;
            const { schedules, activeSems, days, timeSlots } = timetable_data;

            document.title = `${title} - Precision Architect`;
            document.getElementById('timetableTitle').textContent = title;
            document.getElementById('timetableType').textContent = type;
            document.getElementById('timetableDate').textContent = new Date(created_at).toLocaleDateString('en-US', { 
                weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' 
            });

            const container = document.getElementById('timetableContent');
            container.innerHTML = "";

            activeSems.sort().forEach(sem => {
                const semDiv = document.createElement('div');
                semDiv.className = "semester-section";
                
                let html = `
                    <div class="flex items-center gap-4 mb-6">
                        <div class="h-px bg-slate-100 flex-1"></div>
                        <h3 class="text-lg font-extrabold text-slate-800 bg-slate-50 px-6 py-2 rounded-2xl border border-slate-100 uppercase tracking-widest text-sm">Semester ${sem}</h3>
                        <div class="h-px bg-slate-100 flex-1"></div>
                    </div>
                    <div class="overflow-hidden rounded-2xl border border-slate-100 shadow-sm">
                        <table class="w-full text-center border-collapse bg-white">
                            <thead class="bg-slate-900 text-white">
                                <tr class="text-[10px] font-bold uppercase tracking-[0.1em]">
                                    <th class="p-5 border-slate-800">Day</th>
                                    ${timeSlots.map(time => `<th class="p-5 border-l border-slate-800">${time}</th>`).join('')}
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-50">`;

                days.forEach((day, dIndex) => {
                    html += `<tr class="hover:bg-slate-50/50 transition-colors">
                        <td class="p-5 font-bold text-slate-700 bg-slate-50/30 border-r border-slate-50 text-sm">${day}</td>`;
                    
                    schedules[sem][dIndex].forEach((val, pIndex) => {
                        const isLunch = val === "LUNCH";
                        const cellClass = isLunch ? "bg-amber-50/50 text-amber-700 font-bold italic" : "text-slate-600 font-medium";
                        html += `<td class="p-5 text-[11px] border-l border-slate-50 ${cellClass}">${val || "-"}</td>`;
                    });
                    html += `</tr>`;
                });

                html += `</tbody></table></div>`;
                semDiv.innerHTML = html;
                container.appendChild(semDiv);
            });
        }

        function exportPDF() {
            const element = document.getElementById('captureArea');
            const title = document.getElementById('timetableTitle').textContent;
            
            const opt = {
                margin:       0.5,
                filename:     `${title.replace(/\s+/g, '_')}_Timetable.pdf`,
                image:        { type: 'jpeg', quality: 0.98 },
                html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
                jsPDF:        { unit: 'in', format: 'a4', orientation: 'landscape' }
            };

            // Start generation
            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> Generating...';
            btn.disabled = true;

            html2pdf().set(opt).from(element).save().then(() => {
                btn.innerHTML = originalHTML;
                btn.disabled = false;
            });
        }
    </script>
</body>
</html>
