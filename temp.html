<style>
    /* Main Layout Container */
    .main-wrapper {
        display: flex;
        gap: 30px; /* Dono columns ke beech ka gap */
        padding: 20px;
        align-items: flex-start;
        font-family: sans-serif;
    }

    /* Left Column: Semesters */
    .left-column {
        flex: 1; /* 50% width approx */
        max-width: 450px;
    }

    /* Right Column: Teacher Assign */
    .right-column {
        flex: 1; /* 50% width approx */
        background: #ffffff;
        border: 1px solid #e2e8f0;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    /* Semester Grid (Left Side) */
    #semSelectionContainer {
        display: grid;
        grid-template-columns: repeat(2, 1fr); /* 2 columns for cards */
        gap: 15px;
        background: #f8fafc;
        padding: 15px;
        border-radius: 12px;
    }

    /* Semester Card Styling */
    .sem-card {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 15px;
        background: #f1f5f9;
        cursor: pointer;
        transition: 0.3s;
        text-align: center;
    }

    .sem-card:hover { background: #e2e8f0; }
    .sem-card.active {
        background: #006ADC;
        color: white;
        border-color: #006ADC;
    }

    .sem-checkbox { display: none; }

    /* Right Column Elements */
    #teacherListContainer {
        margin-top: 15px;
        border: 1px dashed #cbd5e1;
        padding: 20px;
        border-radius: 8px;
        min-height: 150px;
        background: #fdfdfd;
    }

    #assignTeacherBtn {
        width: 100%;
        margin-top: 15px;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.2s;
    }

    #assignTeacherBtn:hover { background: #1d4ed8; }

    /* Responsive: Mobile par ek ke niche ek */
    @media (max-width: 768px) {
        .main-wrapper { flex-direction: column; }
        .left-column, .right-column { max-width: 100%; width: 100%; }
    }
</style>
</head>
<body>
<div class="main-wrapper">
    <div class="left-column">
        <div class="section">
    <h2>Step 1: Select Semesters</h2>
    <div id="semSelectionContainer">
        <div class="sem-card" onclick="toggleSemester(this, '1')">
            <span class="sem-label">SEM 1</span>
            <span class="status-text">Not Selected</span>
            <input type="checkbox" class="sem-checkbox" value="1">
        </div>

        <div class="sem-card" onclick="toggleSemester(this, '2')">
            <span class="sem-label">SEM 2</span>
            <span class="status-text">Not Selected</span>
            <input type="checkbox" class="sem-checkbox" value="2">
        </div>

        <div class="sem-card" onclick="toggleSemester(this, '3')">
            <span class="sem-label">SEM 3</span>
            <span class="status-text">Not Selected</span>
            <input type="checkbox" class="sem-checkbox" value="3">
        </div>

        <div class="sem-card" onclick="toggleSemester(this, '4')">
            <span class="sem-label">SEM 4</span>
            <span class="status-text">Not Selected</span>
            <input type="checkbox" class="sem-checkbox" value="4">
        </div>

        <div class="sem-card" onclick="toggleSemester(this, '5')">
            <span class="sem-label">SEM 5</span>
            <span class="status-text">Not Selected</span>
            <input type="checkbox" class="sem-checkbox" value="5">
        </div>

        <div class="sem-card" onclick="toggleSemester(this, '6')">
            <span class="sem-label">SEM 6</span>
            <span class="status-text">Not Selected</span>
            <input type="checkbox" class="sem-checkbox" value="6">
        </div>
    </div>
</div>
    </div>

    <div class="right-column">
        <h2>Assign Teacher</h2>
        <div id="teacherListContainer">
            <p style="color: #888; text-align: center;">Please select a class to see subjects.</p>
        </div>
        <button id="assignTeacherBtn">Assign Teacher</button>
    </div>
</div>

<script>
function toggleSemester(card, semValue) {
    const checkbox = card.querySelector(".sem-checkbox");
    const statusText = card.querySelector(".status-text");

    // Toggle Checkbox state
    checkbox.checked = !checkbox.checked;

    // UI Changes
    if (checkbox.checked) {
        card.classList.add("active");
        statusText.textContent = "Selected";
    } else {
        card.classList.remove("active");
        statusText.textContent = "Not Selected";
    }

    // Call your existing sync function
    if (typeof syncSubjects === "function") {
        syncSubjects();
    }
}
</script>
</body>
</html>
